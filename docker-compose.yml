services:
  extreme-policy-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: extreme-policy-manager:latest
    container_name: extreme-policy-manager
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      EXPORT_TIME_ZONE: Europe/Warsaw
      CLAROTY_API_URL: ${CLAROTY_API_URL:-https://eu.api.medigate.io}
      CLAROTY_API_USER: ${CLAROTY_API_USER:-}
      CLAROTY_API_TOKEN: ${CLAROTY_API_TOKEN:-}
